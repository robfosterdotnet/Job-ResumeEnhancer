name: Deploy (Vercel)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel environment (production|preview)"
        required: true
        default: production

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deploy configuration
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy is not configured (missing secrets)."
          fi

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    if: ${{ needs.check.outputs.configured == 'true' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Pull Vercel config
        run: npx vercel@latest pull --yes --environment=${{ github.event.inputs.environment }} --token=$VERCEL_TOKEN

      - name: Build (Vercel)
        run: |
          PROD_FLAG=""
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            PROD_FLAG="--prod"
          fi
          npx vercel@latest build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy (Vercel)
        run: |
          PROD_FLAG=""
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            PROD_FLAG="--prod"
          fi
          npx vercel@latest deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN"
